<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to Data URL Converter</title><style>:root{--primary:#8b5cf6;--bg:#f9fafb;--text:#1f2937;--border:#d1d5db}body{font-family:system-ui,-apple-system,sans-serif;background-color:var(--bg);color:var(--text);display:flex;justify-content:center;padding:3rem 1rem;margin:0}.container{width:100%;max-width:600px}h1{text-align:center;color:var(--primary);margin-bottom:2rem}#drop-zone{border:2px dashed var(--border);border-radius:12px;padding:3rem 2rem;text-align:center;background:#fff;cursor:pointer;transition:all .2s ease;margin-bottom:1.5rem;position:relative}#drop-zone:hover{border-color:var(--primary)}#drop-zone.dragover{border-color:var(--primary);background-color:rgba(139,92,246,.05)}#drop-zone p{margin:0;color:#6b7280;pointer-events:none}#preview{max-width:100%;max-height:200px;margin-top:1rem;border-radius:8px;display:none;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}label{font-size:.875rem;font-weight:600;color:#4b5563;margin-bottom:.5rem;display:block}textarea{width:100%;height:200px;padding:1rem;border:1px solid var(--border);border-radius:8px;font-family:ui-monospace,monospace;font-size:.875rem;resize:vertical;box-sizing:border-box;background:#fff;transition:border-color .2s ease}textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,.2)}</style></head><body><div class="container"><h1>Data URL Generator</h1><div id="drop-zone"><p><strong>Drag and drop</strong> an image,<strong> paste </strong>from clipboard, or<strong> click </strong>to browse.</p><input type="file" id="file-input" accept="image/*" style="display:none"> <img id="preview" alt="Image preview"></div><label for="output">Base64 Data URL</label><textarea id="output" readonly="readonly" placeholder="data:..."></textarea></div><script>const dropZone=document.getElementById("drop-zone"),fileInput=document.getElementById("file-input"),output=document.getElementById("output"),preview=document.getElementById("preview");function preventDefaults(e){e.preventDefault(),e.stopPropagation()}function handleFiles(e){e.length>0&&e[0].type.startsWith("image/")?processFile(e[0]):alert("Please provide a valid image file.")}function processFile(e){const t=new FileReader;t.onload=e=>{const t=e.target.result;output.value=t,preview.src=t,preview.style.display="inline-block"},t.readAsDataURL(e)}["dragenter","dragover","dragleave","drop"].forEach(e=>{dropZone.addEventListener(e,preventDefaults,!1),document.body.addEventListener(e,preventDefaults,!1)}),["dragenter","dragover"].forEach(e=>{dropZone.addEventListener(e,()=>dropZone.classList.add("dragover"),!1)}),["dragleave","drop"].forEach(e=>{dropZone.addEventListener(e,()=>dropZone.classList.remove("dragover"),!1)}),dropZone.addEventListener("drop",e=>{handleFiles(e.dataTransfer.files)}),dropZone.addEventListener("click",()=>fileInput.click()),fileInput.addEventListener("change",function(){handleFiles(this.files)}),window.addEventListener("paste",e=>{const t=(e.clipboardData||e.originalEvent.clipboardData).items;for(const e of t)if("file"===e.kind&&e.type.startsWith("image/")){processFile(e.getAsFile());break}}),output.addEventListener("click",function(){this.select()});</script></body></html>
